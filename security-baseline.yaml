project:
  id: "PRJ-JAYFOODS-AGENT-001"
  name: "Kafui, the JayFoods ordering agent (WhatsApp and website live chat)"
  purpose: "Kafui (said kah-FOO-ee), one AI agent that answers JayFoods customers on the business WhatsApp number and in a live chat on the website, takes juice orders and bookings priced only from the admin catalogue, hands off to staff, recognises the owner, and prepares invoices for the owner"
  owner: "Prince Caleb (PrinceCaleb.dev), delivery lead; JayFoods business owner, data owner"
  executive_sponsor: "JayFoods business owner (name to confirm), accountable for customer data; Prince Caleb accountable for the build"
  intake:
    constraint:
      statement: "JayFoods takes orders by hand on WhatsApp and phone, so enquiries outside working hours wait, prices are quoted from memory, and bulk enquiries from offices, events and shops are slow to answer and easy to lose"
      evidence: "The business number was just moved to the WhatsApp Business Platform with no one answering it; the site's bulk path is a prefilled WhatsApp message with no reply automation; Caleb's brief (23 Oct 2026)"
    forces:
      push: "Missed and slow replies, especially bulk enquiries; prices and delivery fees given inconsistently by hand"
      pull: "An instant, correct answer with real prices, a clear order summary and a reference number, on the channel customers already use"
      anxiety: "Customers worry about a bot getting prices or orders wrong, about being stuck with no person to talk to, and about their number and address being shared; the owner worries about wrong prices, fake orders and other people seeing sales figures"
      habit: "Customers message or call the number and expect a person; staff write orders down by hand"
    existing_assets:
      - "JayFoods site: admin-editable catalogue with per-size unit and bulk prices, delivery zones with fees, opening hours, store open/closed switch, orders table, order tracking, staff emails over Gmail SMTP, encrypted secret storage (SecretBox), admin auth with HttpOnly JWT cookie, authenticated database backups"
      - "The business number registered on the WhatsApp Business Platform in Meta with its profile set"
      - "Lisa (prince-web-app): a proven one-brain agent across web chat and WhatsApp with tool calling, owner recognition, invoices, bookings and handoff, used as the pattern"
      - "jdlcore: multi-provider AI failover with admin-managed keys"
    bet:
      belief: "customers will order and book on WhatsApp and the website chat if replies are instant, prices are exactly the admin's, and a person is one message away"
      wager: "about a week of build and testing, AI provider usage costs, and the risk of an AI agent writing orders that staff must confirm"
      expected_outcome: "more orders and bulk enquiries captured and answered within a minute, at any hour, with no pricing mistakes"
      leading_indicator: "agent-taken orders per week, share of conversations handed off, median first-reply time, and number of price corrections staff make"
    outcomes:
      - "Every WhatsApp and website chat message gets a correct reply within a minute, day or night"
      - "Orders and bookings arrive in the admin with items, quantities, delivery details, name and phone, priced from the admin list"
      - "A customer who asks for a person, or whom the agent cannot help, reaches staff, who can reply from the admin"
      - "The owner can ask for an invoice or a sales summary from their own WhatsApp and gets it"
      - "No customer can see another customer's orders, and no one can change a price or discount through the chat"
    rejected_options:
      - {option: "Gemini and DeepSeek in the provider chain", reason: "Caleb chose Lisa's four providers (CHG-001)"}
      - {option: "ElevenLabs Agents hosting the conversation (Lisa's WhatsApp voice setup)", reason: "Caleb chose against it; the model would run outside our server and prices would depend on tool wiring in a third-party dashboard"}
      - {option: "Meta Cloud API directly as the default WhatsApp transport", reason: "Caleb chose Twilio (CHG-002): it is how Lisa runs, Twilio's sign-up does the Meta side, and creating a Meta app was blocked until the business is registered. Meta direct stays in the code as an alternative provider"}
      - {option: "Free-form model replies with prices written by the model", reason: "Prices could be invented; all money figures come from server-side tools instead"}
      - {option: "A separate WhatsApp-only price list", reason: "Two price lists drift; the admin catalogue stays the single source"}
  regulatory_context:
    - regime: "Ghana Data Protection Act, 2012 (Act 843): names, phone numbers, addresses and chat transcripts of customers; processing by AI providers and Meta outside Ghana"
      status: "APPLICABLE"
      notes: "Treated as applicable (Caleb for the JayFoods owner, 23 Oct 2026, DEC-004): 90-day transcript retention, privacy notice update, deletion on request; Data Protection Commission registration is the owner's action. Not legal advice"
    - regime: "Twilio terms of service and acceptable use policy (WhatsApp messages pass through Twilio)"
      status: "APPLICABLE"
      notes: "Twilio processes message content and phone numbers as a processor (CHG-002). Addressed by CTL-DATA-002 and the privacy notice"
    - regime: "WhatsApp Business Terms, Business Messaging Policy and Commerce Policy (Meta)"
      status: "APPLICABLE"
      notes: "Opt-in for business-initiated messages, 24-hour customer service window, human escalation path, allowed goods. Addressed by CTL-API-003 and CTL-AI-006"
    - regime: "Terms of the AI model providers used (data use, retention, acceptable use)"
      status: "APPLICABLE"
      notes: "Providers are chosen in DEC-003; settings that exclude training on API data must be confirmed per provider"
    - regime: "PCI DSS"
      status: "NOT_APPLICABLE"
      notes: "The agent never sees or stores card data. Existing card payments run on Paystack's hosted page and the agent takes no payments"
risk:
  tier: "HIGH"
  mode: "FULL"
  rationale:
    - "An AI agent writes orders and bookings into the business database from untrusted public messages"
    - "Owner-only tools expose all customers' orders and sales figures, gated on the sender's WhatsApp number"
    - "Customer personal data (name, phone, address, transcripts) flows to Meta and AI providers abroad"
    - "Two internet-facing channels (Meta webhook, public chat endpoint) with per-message AI cost that can be abused"
  likely_production_tier: "HIGH"
  assurance:
    asvs_level: "L2"
    slsa_build_level: 2
    slsa_source_level: 3
lifecycle:
  status: "APPROVED"
  production_posture: "ELIGIBLE_WHEN_APPROVED"
  spike_expires_at: null
  development_lock: "UNLOCKED"
  deployment_lock: "UNLOCKED"
classification_levels: [PUBLIC, INTERNAL, CONFIDENTIAL, SENSITIVE, RESTRICTED]
assets:
  - {id: "AST-001", name: "Customer personal data (name, phone, delivery address)", classification: "CONFIDENTIAL", owner: "JayFoods owner", retention: "Kept with the order record; deleted on request"}
  - {id: "AST-002", name: "Chat transcripts (WhatsApp and website)", classification: "CONFIDENTIAL", owner: "JayFoods owner", retention: "90 days after the last message, then deleted by a daily job (proposed, DEC-004)"}
  - {id: "AST-003", name: "Orders, bookings and invoices", classification: "CONFIDENTIAL", owner: "JayFoods owner", retention: "As the existing orders table; invoice files deleted 30 days after creation"}
  - {id: "AST-004", name: "Catalogue, prices, delivery zones, hours", classification: "PUBLIC", owner: "JayFoods owner", retention: "Current values only, edited in the admin"}
  - {id: "AST-005", name: "Provider secrets: Meta access token and app secret, webhook verify token, AI provider keys, SMTP password", classification: "RESTRICTED", owner: "Prince Caleb", retention: "Encrypted in the database until rotated"}
  - {id: "AST-006", name: "Application key (database/app.key): JWT signing, secret encryption, link and session signing", classification: "RESTRICTED", owner: "Prince Caleb", retention: "Server file outside Git; rotated on compromise"}
  - {id: "AST-007", name: "Owner reports: sales figures and order lists", classification: "CONFIDENTIAL", owner: "JayFoods owner", retention: "Generated on request, not stored beyond the transcript"}
components:
  - {id: "CMP-001", name: "Storefront pages and public API (existing)", exposure: "INTERNET", provider: "cPanel PHP hosting"}
  - {id: "CMP-002", name: "Admin control center (existing, extended with WhatsApp settings, inbox and agent log)", exposure: "INTERNET", provider: "cPanel PHP hosting"}
  - {id: "CMP-003", name: "WhatsApp webhook endpoint (/api/v1/whatsapp/webhook)", exposure: "INTERNET", provider: "cPanel PHP hosting"}
  - {id: "CMP-004", name: "Website live chat widget and endpoint (/api/v1/chat)", exposure: "INTERNET", provider: "cPanel PHP hosting"}
  - {id: "CMP-005", name: "Agent engine and tool layer (one brain for both channels)", exposure: "PRIVATE", provider: "cPanel PHP hosting", ai_capability: true}
  - {id: "CMP-006", name: "AI model providers in a failover chain: Anthropic, OpenAI, OpenRouter, Groq, each with an optional backup model", exposure: "THIRD_PARTY", provider: "Anthropic, OpenAI, OpenRouter, Groq (DEC-003, CHG-001)", ai_capability: true}
  - {id: "CMP-007", name: "WhatsApp provider: Twilio WhatsApp sender (default) or Meta Cloud API, one active at a time", exposure: "THIRD_PARTY", provider: "Twilio, with Meta behind it (CHG-002)"}
  - {id: "CMP-008", name: "SQLite database and invoice file store (outside the web root)", exposure: "PRIVATE", provider: "cPanel PHP hosting"}
  - {id: "CMP-009", name: "Staff email over Gmail SMTP (existing)", exposure: "THIRD_PARTY", provider: "Google"}
  - {id: "CMP-010", name: "GitHub repository, CI and deployment to cPanel", exposure: "THIRD_PARTY", provider: "GitHub; cPanel (deploy method in DEC-006)"}
trust_boundaries:
  - {id: "TB-001", name: "Internet to the JayFoods site", from: "PUBLIC_INTERNET", to: ["CMP-001", "CMP-002", "CMP-004"]}
  - {id: "TB-002", name: "Twilio (or Meta) to the WhatsApp webhook", from: "CMP-007", to: ["CMP-003"]}
  - {id: "TB-003", name: "Server to AI providers", from: "CMP-005", to: ["CMP-006"]}
  - {id: "TB-004", name: "Model output to tools and database", from: "CMP-006", to: ["CMP-005", "CMP-008"]}
  - {id: "TB-005", name: "Server to Twilio (or Meta) and SMTP (outbound)", from: "CMP-005", to: ["CMP-007", "CMP-009"]}
  - {id: "TB-006", name: "Repository and CI to hosting", from: "CMP-010", to: ["CMP-001", "CMP-002", "CMP-003", "CMP-004", "CMP-005"]}
data_flows:
  - {id: "FLW-001", name: "WhatsApp message in and reply out", origin: "Customer or owner on WhatsApp", processing: "Twilio signs and posts the message (X-Twilio-Signature); the webhook verifies the signature, drops duplicates, rate-limits the number, runs the agent, sends the reply through Twilio's Messages API (Meta Cloud API when Meta is the chosen provider)", destination: "Transcript in SQLite; reply to the sender", classification: "CONFIDENTIAL", retention: "90 days (AST-002)", boundaries: ["TB-002", "TB-003", "TB-005"]}
  - {id: "FLW-002", name: "Website live chat", origin: "Anonymous site visitor", processing: "Chat endpoint issues a signed session, rate-limits per session and IP, runs the same agent with customer tools only", destination: "Transcript in SQLite; reply in the widget", classification: "CONFIDENTIAL", retention: "90 days (AST-002)", boundaries: ["TB-001", "TB-003"]}
  - {id: "FLW-003", name: "Order or booking written by the agent", origin: "Agent tool call after the customer confirms a server-made summary", processing: "Tool re-prices from the database, checks the confirmed quote id, writes a pending, unpaid order or booking marked as from the agent", destination: "orders, order_items, bookings tables; staff email", classification: "CONFIDENTIAL", retention: "As AST-003", boundaries: ["TB-004", "TB-005"]}
  - {id: "FLW-004", name: "Prompt to AI provider", origin: "Agent engine", processing: "System prompt with public business facts and the tool list, plus the last 20 turns of this conversation only; no secrets, no other customers' data", destination: "AI provider (CMP-006)", classification: "CONFIDENTIAL", retention: "Provider retention per DEC-003", boundaries: ["TB-003"]}
  - {id: "FLW-005", name: "Handoff to staff", origin: "Customer request or agent uncertainty", processing: "Conversation switched to staff mode; agent stops replying; staff emailed; staff reply from the admin inbox inside the 24-hour window", destination: "Admin inbox; Graph API", classification: "CONFIDENTIAL", retention: "90 days (AST-002)", boundaries: ["TB-001", "TB-005"]}
  - {id: "FLW-006", name: "Owner tools and invoices", origin: "Owner on WhatsApp (recognised number)", processing: "Owner-only tools run read-only reports and generate an invoice PDF stored outside the web root, served by a signed link that expires", destination: "Owner's WhatsApp (document message) and the owner's email", classification: "CONFIDENTIAL", retention: "Invoice file 30 days", boundaries: ["TB-002", "TB-005"]}
identities:
  - id: "ID-001"
    name: "Customer on WhatsApp"
    type: "HUMAN"
    authentication: "Sender number as delivered by Meta inside a signed webhook"
    resources: ["CMP-003", "CMP-005"]
    permissions: ["read menu, prices, zones and hours", "get a server-made quote", "place an order or booking after confirming the quote", "read their own orders (matched on their WhatsApp number)", "ask for an invoice of their own order (sent to the owner for review)", "ask for a person"]
    forbidden_actions: ["read any other customer's data", "change prices, discounts or delivery fees", "change order status or payment status", "use owner tools"]
    human_approval: "Staff confirm every agent-taken order before it is prepared"
  - id: "ID-002"
    name: "Website chat visitor"
    type: "HUMAN"
    authentication: "None; signed anonymous chat session"
    resources: ["CMP-004", "CMP-005"]
    permissions: ["same as ID-001, except order lookups need the order reference and the phone number on the order"]
    forbidden_actions: ["everything forbidden to ID-001", "owner tools regardless of what number is typed"]
    human_approval: "Staff confirm every agent-taken order"
  - id: "ID-003"
    name: "Owner on WhatsApp"
    type: "HUMAN"
    authentication: "Sender number equals a number on the owner list in the admin, delivered inside a Meta-signed webhook; WhatsApp only, never the website chat"
    resources: ["CMP-003", "CMP-005", "CMP-008"]
    permissions: ["everything ID-001 can do", "sales summary for a date range", "list orders and bookings", "create an invoice PDF for any order and receive it"]
    forbidden_actions: ["cancel, refund or change orders", "change prices, stock or settings", "send messages to customers through the agent", "export the customer list"]
    human_approval: "Changes to orders and prices stay in the admin, behind admin login"
  - id: "ID-004"
    name: "Admin accounts with a role: super admin, admin or staff (CHG-003)"
    type: "HUMAN"
    authentication: "Existing admin login, HttpOnly JWT cookie; the role is read from the database on every request"
    resources: ["CMP-002"]
    permissions: ["super admin: everything, including WhatsApp and AI provider settings, the owner list, WhatsApp templates, email and Paystack settings, backups, accounts and roles, and the error log", "admin: products and prices, site content, delivery zones, promo codes, the Kafui on/off switch, the agent action log and the admin activity log, plus everything staff can do", "staff: orders, customers, messages, the Kafui inbox (read, reply, take over, hand back, send an approved template), bookings and the test chat"]
    forbidden_actions: ["read stored secrets back (write-only fields)", "admin and staff: any AI provider, WhatsApp or Kafui setting, provider error details, templates management, accounts, backups or the error log", "anyone: change their own role, switch off or delete their own account, or remove the last active super admin"]
    human_approval: "Not applicable"
  - id: "ID-005"
    name: "Agent (model plus tool layer)"
    type: "AGENT"
    authentication: "Runs in-process; no credentials of its own"
    resources: ["CMP-005"]
    permissions: ["call only the tools allowed for the caller's role (customer or owner), with server-validated arguments"]
    forbidden_actions: ["raw SQL, shell, file or arbitrary HTTP access", "see secrets, other conversations or other customers' data", "write prices or totals", "act after the kill switch is off", "more than 6 tool calls per turn"]
    human_approval: "Orders and bookings land as pending for staff; owner tools need the owner's number"
  - id: "ID-006"
    name: "WhatsApp webhook sender (Twilio, or Meta when chosen)"
    type: "WORKLOAD"
    authentication: "Twilio: X-Twilio-Signature, HMAC-SHA1 with the auth token over the exact webhook URL and the sorted POST fields. Meta: X-Hub-Signature-256 HMAC-SHA256 over the raw body with the app secret, and the verify-token handshake. Only the chosen provider's webhook accepts messages"
    resources: ["CMP-003"]
    permissions: ["deliver message and status events"]
    forbidden_actions: ["anything else; unsigned or badly signed requests get 401 and no processing"]
    human_approval: "Not applicable"
  - id: "ID-007"
    name: "Server sending WhatsApp messages"
    type: "WORKLOAD"
    authentication: "Twilio: Account SID and auth token over HTTP Basic (account-wide; Twilio offers no per-sender scope). Meta: system-user token with whatsapp_business_messaging on this one WhatsApp account"
    resources: ["CMP-007"]
    permissions: ["send messages and documents from the JayFoods number"]
    forbidden_actions: ["anything beyond sending WhatsApp messages from the JayFoods sender; the code calls only the Messages API"]
    human_approval: "Credentials entered by Caleb in the admin; Twilio account owned and billed as decided in DEC-008"
  - id: "ID-008"
    name: "Deployment"
    type: "WORKLOAD"
    authentication: "Method decided in DEC-006"
    resources: ["CMP-010"]
    permissions: ["deploy a reviewed commit from main"]
    forbidden_actions: ["read the production database or secrets"]
    human_approval: "Caleb merges the pull request and triggers the deploy"
threats:
