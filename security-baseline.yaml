  - {id: "THR-017", component_ids: ["CMP-002", "CMP-008"], scenario: "A staff or admin login is shared, phished or left signed in, and is used to read provider keys, WhatsApp settings, backups or other accounts, or to give itself more access", likelihood: "MEDIUM", impact: "HIGH", control_ids: ["CTL-AUTHZ-004", "CTL-LOG-003"], refs: ["OWASP-T10-2025:A01"], residual_risk: "LOW", owner: "Prince Caleb", status: "OPEN"}
controls:
  - {id: "CTL-GOV-001", domain: "GOVERNANCE", requirement: "No agent code is written, committed or deployed until Caleb explicitly approves this baseline version; any change to tools, roles, providers or data flows goes through a CHG record and reapproval", status: "IMPLEMENTED", owner: "Prince Caleb", acceptance: "Approval recorded with digest; the PR check fails when the baseline is not APPROVED with the protected digest", refs: ["SSDF-1.1:PO.1", "CISA-SBD:OWNERSHIP"], evidence_ids: []}
  - {id: "CTL-AI-001", domain: "AI_AGENT", requirement: "Tool allow-list per role, decided in code from the authenticated channel identity, never from anything the model or the customer says. Customer role: get_menu, quote_order, place_order, create_booking, my_orders, request_invoice, handoff. Owner role adds sales_summary, list_orders, list_bookings, create_invoice. Unknown tool names and extra arguments are rejected; every argument is validated (ids exist and are active, quantities 1 to 5000, dates in the next 60 days, text fields length-capped)", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Tests: a customer-role turn that asks for list_orders gets a refusal from the tool layer; unknown tool and out-of-range arguments are rejected; seeded injection messages produce no privileged tool call", refs: ["OWASP-LLM-2025:LLM06", "OWASP-ASI-2026:ASI02", "OWASP-LLM-2025:LLM01"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-AI-002", domain: "AI_AGENT", requirement: "Money is computed only by tools from the database: quote_order returns the line prices, bulk tier, delivery fee and total with a quote id; place_order accepts only a quote id the customer was shown in this conversation within 2 hours, re-prices it, and refuses if any price changed. The model cannot pass prices, discounts or totals; promo codes are not available through the chat", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Tests: place_order without a quote, with another conversation's quote, an expired quote, or after a price edit is refused; the stored order total equals the database price", refs: ["OWASP-LLM-2025:LLM06", "OWASP-ASI-2026:ASI02"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-AI-003", domain: "AI_AGENT", requirement: "Reply check before sending: every money amount in the model's reply must match a catalogue price, a delivery fee or a quote total from this conversation; otherwise the reply is replaced with the server-written quote text and the event is logged", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Test: a reply with an invented amount is replaced and logged; a reply quoting the real total passes", refs: ["OWASP-LLM-2025:LLM05", "OWASP-LLM-2025:LLM09"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-AI-004", domain: "AI_AGENT", requirement: "Limits: at most 6 tool calls and 2 model rounds per attempt, each provider attempt its own time limit (20 s; OpenRouter 30 s) and the whole chain at most 90 s, 600 output tokens (2,000 for free OpenRouter models, CHG-005), last 20 turns of history; per sender 20 messages per 10 minutes and 200 per day; at most 5 agent orders and 3 bookings per sender per day. Over the limit the agent stops calling the model and sends a fixed message", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Tests trip each limit and show no model call past it", refs: ["OWASP-LLM-2025:LLM10", "OWASP-ASI-2026:ASI08"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-AI-005", domain: "AI_AGENT", requirement: "Handoff: the handoff tool, the words agent/person/human/manager, or two failed answers switch the conversation to staff mode; the agent then sends one fixed message and stays silent until staff hand it back in the admin. Staff are emailed with the conversation link", status: "VERIFIED", owner: "JayFoods owner", acceptance: "Test: after handoff an inbound message gets no model call and no reply; hand-back restores replies", refs: ["OWASP-ASI-2026:ASI09"], evidence_ids: ["EVD-006", "EVD-007"]}
  - {id: "CTL-AI-006", domain: "AI_AGENT", requirement: "Disclosure and trust: the first reply in a conversation introduces Kafui as JayFoods' automatic assistant and that a person is available on request; every order reply states the order is pending until staff confirm; the agent states facts only from the admin data and says it does not know otherwise", status: "IMPLEMENTED", owner: "JayFoods owner", acceptance: "Transcript review of the test scenarios shows the disclosure and pending wording", refs: ["OWASP-ASI-2026:ASI09", "OWASP-LLM-2025:LLM09"], evidence_ids: []}
  - {id: "CTL-AI-007", domain: "AI_AGENT", requirement: "Kill switch and action log: an admin switch turns the agent off on both channels at once (messages are still stored for staff); every tool call is logged with conversation, role, tool, arguments, result status and time, and shown in the admin", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Test: with the switch off no model or tool runs and the fixed away message is sent; log rows appear for every tool call", refs: ["OWASP-ASI-2026:ASI10"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-AUTHZ-004", domain: "AUTHZ", requirement: "Admin roles (CHG-003): every /api/v1/admin route is checked on the server against one rule table (src/Support/Roles.php) after sign-in; a route not in the table is for the super admin only. AI provider and Kafui settings, the owner list, WhatsApp template management, email and Paystack settings, backups, accounts and roles, and the error log are super admin only. Only the super admin manages accounts; nobody can change their own role or switch off their own account, and the last active super admin cannot be demoted, switched off or deleted. The menu hides what a role cannot open, but the server check is the control", status: "IMPLEMENTED", owner: "Prince Caleb", acceptance: "Tests: each super-admin-only route refused for admin and staff, admin routes refused for staff, staff routes open to all three, unknown roles refused; the last-super-admin and own-role rules hold. Browser check on a local copy as each role", refs: ["OWASP-T10-2025:A01", "ASVS-5.0:V8"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-AUTHZ-001", domain: "AUTHZ", requirement: "Customer tools are scoped to the caller: on WhatsApp my_orders matches the Meta-delivered sender number; on the website it needs the order reference plus the phone on the order (as the existing tracker). No tool takes a customer phone or id as a free argument to read data", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Tests: customer A cannot read customer B's orders by any argument or message", refs: ["OWASP-T10-2025:A01", "ASVS-5.0:V8"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-AUTHZ-002", domain: "AUTHZ", requirement: "Owner role is granted only on the WhatsApp channel when the signed webhook's sender number exactly equals a number on the owner list (E.164, saved in the admin). The website chat never grants it. Owner tools are read-only plus invoice creation", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Tests: website chat saying it is the owner gets customer tools only; a non-listed number gets customer tools only; the listed number gets owner tools", refs: ["OWASP-T10-2025:A01", "OWASP-ASI-2026:ASI03"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-AUTHZ-003", domain: "AUTHZ", requirement: "Owner-tool use notifies the owner's email with what was asked (time, tool), so use from a lost or borrowed phone is visible; removing a number from the owner list takes effect on the next message", status: "IMPLEMENTED", owner: "JayFoods owner", acceptance: "Test: an owner tool call sends the notice; a removed number loses owner tools immediately", refs: ["OWASP-ASI-2026:ASI03"], evidence_ids: []}
  - {id: "CTL-AUTH-001", domain: "AUTH", requirement: "Before go-live, the first-run admin password is changed on the live site and the migration stops printing or seeding a fixed password (it generates a random one shown once on the server console)", status: "PLANNED", owner: "Prince Caleb", acceptance: "Login with the published password fails on the live site; the migration seeds a random password", refs: ["OWASP-T10-2025:A07", "ASVS-5.0:V6"], evidence_ids: []}
  - {id: "CTL-SES-001", domain: "SESSION", requirement: "Admin keeps the existing HttpOnly JWT cookie; new state-changing admin routes (reply, take over, settings) reject cross-site requests by requiring JSON content type and a same-origin Origin header. Website chat sessions are random ids signed with the app key, expire after 24 hours, and carry no privilege", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Tests: a cross-origin form post to the reply route is refused; a tampered chat session id is refused", refs: ["ASVS-5.0:V7", "OWASP-T10-2025:A07"], evidence_ids: ["EVD-006", "EVD-007"]}
  - {id: "CTL-API-001", domain: "API", requirement: "Webhook authentication: Twilio requests must carry X-Twilio-Signature equal to HMAC-SHA1, with the auth token, of the configured webhook URL plus the sorted POST fields (constant-time compare), otherwise 403 and nothing is stored. Meta requests (when Meta is chosen) must carry X-Hub-Signature-256 over the raw body with the app secret, and the GET handshake answers only to the saved verify token. The provider not chosen accepts nothing", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Tests for both providers: missing, wrong, tampered and wrong-URL signatures are refused; a correct one is processed; the provider not chosen ignores requests", refs: ["ASVS-5.0:V4", "OWASP-T10-2025:A08"], evidence_ids: ["EVD-006", "EVD-007"]}
  - {id: "CTL-API-002", domain: "API", requirement: "Idempotency: each WhatsApp message id is processed once (unique key); Meta gets 200 as soon as the event is stored, and the agent work runs after the response is flushed; status events are stored, not acted on", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Test: the same signed payload posted twice gives one reply and one order", refs: ["ASVS-5.0:V4"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-API-003", domain: "API", requirement: "WhatsApp policy: free-form replies only inside 24 hours of the customer's last message; the agent never starts conversations; staff replies after 24 hours are blocked with a clear message (templates out of scope); chat endpoint limits per session and per IP; payloads over 4 KB and texts over 1,000 characters are refused", status: "IMPLEMENTED", owner: "Prince Caleb", acceptance: "Tests for the 24-hour block and the size and rate limits", refs: ["ASVS-5.0:V4", "OWASP-LLM-2025:LLM10"], evidence_ids: []}
  - {id: "CTL-INP-001", domain: "INPUT", requirement: "All SQL through prepared statements; message text stored as plain text and HTML-escaped everywhere it is shown; tool arguments type-checked and length-capped; text sent to WhatsApp stripped of control characters", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Tests: script and SQL strings in messages are stored and shown inert", refs: ["ASVS-5.0:V1", "OWASP-T10-2025:A05"], evidence_ids: ["EVD-006", "EVD-007"]}
  - {id: "CTL-FE-001", domain: "FRONTEND", requirement: "Chat widget and admin inbox render text with textContent, never innerHTML for chat data; the widget is first-party code with no third-party scripts; no secrets or keys reach the browser", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Review of the widget and inbox code; a stored script string renders as text", refs: ["ASVS-5.0:V3", "OWASP-T10-2025:A05"], evidence_ids: ["EVD-007"]}
  - {id: "CTL-FILE-001", domain: "FILE", requirement: "Invoice PDFs are generated server-side by built-in code into database/invoices (outside the web root) with random 32-hex names, served only through a link signed with the app key that expires after 72 hours, and deleted after 30 days. No uploads are accepted from chat; inbound WhatsApp media is not downloaded (the agent asks for text)", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Tests: an unsigned, tampered or expired link gets 403; files are not reachable by path", refs: ["ASVS-5.0:V5"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-CRY-001", domain: "CRYPTO", requirement: "Signing uses HMAC-SHA256 with keys derived per purpose from the app key (chat session, invoice link); secrets at rest use the existing AES-256-GCM SecretBox; random values from random_bytes; HTTPS only on the live site", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Code review; tests for signature checks; TLS check on the live domain", refs: ["ASVS-5.0:V11", "ASVS-5.0:V12"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-SEC-001", domain: "SECRETS", requirement: "Meta token, app secret, verify token and AI keys are entered in the admin, stored encrypted, never returned to the browser (shown as saved or not), never put in prompts or logs, and never committed. The public repository holds no secrets, databases or app key", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Secret scan on the pull request passes; the settings API returns has_* flags only", refs: ["OWASP-T10-2025:A02", "OWASP-LLM-2025:LLM07"], evidence_ids: ["EVD-006", "EVD-008"]}
  - {id: "CTL-SEC-002", domain: "SECRETS", requirement: "Least privilege and rotation: the Twilio auth token is account-wide, so JayFoods uses its own Twilio account (or a subaccount) holding only this sender, and the token is rotated if exposed; the Meta token, when Meta is chosen, is a system-user token with whatsapp_business_messaging on this one WhatsApp account only; AI keys are per-client keys with spend limits set at the provider; the setup notes give the rotation steps for each secret", status: "PLANNED", owner: "Prince Caleb", acceptance: "Config inspection of the token's permissions and provider spend limits", refs: ["OWASP-T10-2025:A02"], evidence_ids: []}
  - {id: "CTL-CFG-001", domain: "CONFIG", requirement: "Agent is off by default until the settings are complete; the live site sends security headers on the new pages (CSP for the widget, frame-ancestors none for admin, nosniff); PHP errors are logged, not displayed", status: "PLANNED", owner: "Prince Caleb", acceptance: "Header check on the live site; a fresh install shows the agent off", refs: ["CISA-SBD:SECURE-DEFAULTS", "SSDF-1.1:PW.9"], evidence_ids: []}
  - {id: "CTL-DATA-001", domain: "DATA", requirement: "Minimise what reaches providers: prompts carry only public business facts and this conversation's last 20 turns; no other customers' data, no secrets, no admin notes. Transcripts deleted 90 days after the last message, invoice files after 30 days, by a daily job", status: "VERIFIED", owner: "JayFoods owner", acceptance: "Prompt-building test shows the allowed fields only; the cleanup job deletes old rows in a test", refs: ["OWASP-LLM-2025:LLM02", "ASVS-5.0:V14"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-DATA-002", domain: "DATA", requirement: "Privacy notice on the site updated to name WhatsApp and the AI providers as processors and the retention periods; providers configured not to train on API data where they offer it; a customer can ask staff to delete their chat and data", status: "PLANNED", owner: "JayFoods owner", acceptance: "Updated privacy page reviewed by the owner; provider settings inspected", refs: ["ASVS-5.0:V14"], evidence_ids: []}
  - {id: "CTL-ERR-001", domain: "ERROR_HANDLING", requirement: "If every provider fails or the budget runs out, the customer gets a fixed message that a person will reply, the conversation is flagged for staff, and no tool runs; tool errors return a safe message to the model, never stack traces; send failures are logged and retried once", status: "VERIFIED", owner: "Prince Caleb", acceptance: "Test with all providers failing shows the fixed message, the handoff flag and no order", refs: ["OWASP-T10-2025:A10"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-LOG-001", domain: "LOGGING", requirement: "Logs record event types, ids, outcomes and signature failures, never tokens, keys or full message bodies; server error_log lines mask phone numbers to the last 4 digits", status: "IMPLEMENTED", owner: "Prince Caleb", acceptance: "Review of sample logs from the test run", refs: ["OWASP-T10-2025:A09", "ASVS-5.0:V16"], evidence_ids: []}
  - {id: "CTL-LOG-003", domain: "LOGGING", requirement: "Site-wide error log for the super admin only (CHG-003): PHP warnings, uncaught exceptions and fatal errors, 5xx API responses, failed calls to AI providers, Twilio, Meta and Paystack, failed email, and script errors reported by visitors' browsers (public endpoint, at most 20 reports per IP per hour, 4 KB). Query strings are dropped from logged addresses; keys, tokens, emails and phone numbers are masked before saving; repeats within an hour are counted on one row; kept 30 days and capped at 5,000 rows", status: "IMPLEMENTED", owner: "Prince Caleb", acceptance: "Tests: repeats counted on one row; a failed provider call is logged with its reason and without the key from its address or headers; masking of keys, tokens, emails and numbers; entries older than 30 days cleared; admin and staff refused the error log", refs: ["OWASP-T10-2025:A09", "ASVS-5.0:V16"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-LOG-002", domain: "LOGGING", requirement: "Agent action log (CTL-AI-007) plus counters on the admin dashboard: signature failures, provider failures, handoffs, replaced replies, owner-tool uses, agent orders per day; staff email when signature failures or provider failures exceed the thresholds in monitoring", status: "IMPLEMENTED", owner: "Prince Caleb", acceptance: "Seeded failures raise the counters and send the email", refs: ["OWASP-T10-2025:A09", "OWASP-ASI-2026:ASI10"], evidence_ids: []}
  - {id: "CTL-SC-001", domain: "SUPPLY_CHAIN", requirement: "No new third-party packages (plain PHP, as the project rule); a pull-request workflow runs PHP lint, the agent test suite and a secret scan; a minimal CycloneDX SBOM lists the PHP runtime and extensions", status: "IMPLEMENTED", owner: "Prince Caleb", acceptance: "Workflow run on the pull request passes and fails on a seeded secret", refs: ["OWASP-T10-2025:A03", "SLSA-1.2:BUILD-L2"], evidence_ids: []}
  - {id: "CTL-DEP-001", domain: "DEPLOY", requirement: "main is protected (pull request required, the CI check required, no force push); deploys come only from main after Caleb merges; the release is a tagged archive with a build provenance attestation from GitHub Actions", status: "PLANNED", owner: "Prince Caleb", acceptance: "Branch protection inspected; a push straight to main is refused; the release shows an attestation", refs: ["SSDF-1.1:PS.1", "SLSA-1.2:SOURCE-L3"], evidence_ids: []}
  - {id: "CTL-REC-003", domain: "RECOVERY", requirement: "Deploys cannot leave new code on an old database (CHG-004): the first request after a pull runs the same idempotent migration as php database/migrate.php, once, under a file lock, keyed on a fingerprint of schema.sql and migrate.php saved outside the web root; a failed run is written to the error log and retried after five minutes. A brand-new database's first-admin password is saved only to database/first-run-admin.txt (0600, outside the web root, git-ignored). Pages, scripts and styles are sent with Cache-Control: no-cache so browsers use the deployed files", status: "IMPLEMENTED", owner: "Prince Caleb", acceptance: "Tests: a migrated database is left alone; a database behind the code is brought up to date by the first request, once; a brand-new database gets its first admin with the password kept on the server; a failed run waits before retrying. Local web check: the first request ran the migration and wrote the stamp", refs: ["ASVS-5.0:V13"], evidence_ids: ["EVD-006"]}
  - {id: "CTL-REC-001", domain: "RECOVERY", requirement: "Incident steps in SECURITY.md: switch the agent off, rotate the Meta token and app secret, rotate AI keys, rotate the app key if the server is compromised (re-enter secrets after), review the action log, restore from backup if data changed", status: "IMPLEMENTED", owner: "Prince Caleb", acceptance: "Tabletop run of the steps on the staging copy", refs: ["SSDF-1.1:RV.2"], evidence_ids: []}
  - {id: "CTL-REC-002", domain: "RECOVERY", requirement: "Daily database backup kept off the server for 30 days (cPanel backup or the admin backup downloaded by a scheduled job), and one restore rehearsed before go-live", status: "PLANNED", owner: "Prince Caleb", acceptance: "A restore of a backup on staging shows agent orders intact", refs: ["SSDF-1.1:PS.3"], evidence_ids: []}
gates:
  - {id: "GATE-001", name: "Baseline approval", stage: "PRE_IMPLEMENTATION", blocking: true, control_ids: ["CTL-GOV-001"], required_evidence: ["EVD-001"], status: "CONFIGURED", evidence_ids: ["EVD-001"]}
  - {id: "GATE-002", name: "Pull request checks: lint, agent tests (roles, prices, injection, signatures, limits), secret scan, baseline digest", stage: "PULL_REQUEST", blocking: true, control_ids: ["CTL-SC-001", "CTL-AI-001", "CTL-AI-002", "CTL-AI-003", "CTL-AI-004", "CTL-AUTHZ-001", "CTL-AUTHZ-002", "CTL-API-001", "CTL-API-002", "CTL-SEC-001", "CTL-GOV-001", "CTL-AUTHZ-004", "CTL-LOG-003"], required_evidence: ["EVD-002"], status: "NOT_YET_BUILT", evidence_ids: []}
  - {id: "GATE-003", name: "Go-live check on the live number: owner list set, admin password changed, token permissions, spend limits, headers, privacy notice, restore rehearsed, scenario script passed", stage: "PRE_DEPLOY", blocking: true, control_ids: ["CTL-DEP-001", "CTL-AUTH-001", "CTL-SEC-002", "CTL-CFG-001", "CTL-DATA-002", "CTL-REC-002", "CTL-AI-006"], required_evidence: ["EVD-003", "EVD-004"], status: "NOT_YET_BUILT", evidence_ids: []}
  - {id: "GATE-004", name: "Runtime limits and kill switch", stage: "RUNTIME", blocking: true, control_ids: ["CTL-AI-004", "CTL-AI-005", "CTL-AI-007", "CTL-API-003", "CTL-ERR-001", "CTL-LOG-001", "CTL-LOG-002", "CTL-AUTHZ-003", "CTL-REC-001"], required_evidence: ["EVD-005"], status: "NOT_YET_BUILT", evidence_ids: []}
decisions:
  - {id: "DEC-001", question: "What do 'bookings' mean for JayFoods?", owner: "Prince Caleb with the JayFoods owner", required_decision: "Decided (Caleb, 23 Oct 2026): event and bulk-supply bookings for a future date (date, time, venue, number of guests, juices wanted), saved for staff to confirm and quote, plus 'call me back' requests. No calendar slots or deposits", blocks_approval: true, status: "DECIDED"}
  - {id: "DEC-002", question: "Which WhatsApp numbers are the owner, and what may the owner do from WhatsApp?", owner: "JayFoods owner", required_decision: "Decided (Caleb, 23 Oct 2026): one or two listed numbers, entered in the admin (numbers to come from Caleb); owner tools are read-only (sales summary, order and booking lists) plus invoice creation; no cancelling, refunds, price or stock changes from WhatsApp", blocks_approval: true, status: "DECIDED"}
  - {id: "DEC-003", question: "Which AI providers run the agent, on whose account and with what spend limit?", owner: "Prince Caleb", required_decision: "Decided (Caleb, 23 Oct 2026, revised by CHG-001): Lisa's chain, Anthropic then OpenAI then OpenRouter then Groq, each a fresh attempt with its own time limit and an optional backup model, then the fixed reply and a staff handoff if all fail; keys on the client's own accounts (or Caleb's, billed through Opskeep), with a monthly spend cap at each provider", blocks_approval: true, status: "DECIDED"}
  - {id: "DEC-004", question: "Data protection: does the owner treat Act 843 as applicable, will they register with the Data Protection Commission, and do they accept 90-day transcript retention and the privacy notice changes?", owner: "JayFoods owner", required_decision: "Decided (Caleb, 23 Oct 2026): Act 843 treated as APPLICABLE; 90-day transcript retention; privacy notice updated; not legal advice", blocks_approval: true, status: "DECIDED"}
  - {id: "DEC-005", question: "How do agent-taken orders get paid?", owner: "JayFoods owner", required_decision: "Proposed: orders land unpaid and pending; staff confirm and arrange MoMo or cash on delivery. A Paystack link from the chat is a later change", blocks_approval: false, status: "OPEN"}
  - {id: "DEC-006", question: "How is the site deployed to cPanel, and what is the live HTTPS domain for the webhook?", owner: "Prince Caleb", required_decision: "Deploy method (cPanel Git pull of main, or upload of the tagged release) and the domain", blocks_approval: false, status: "OPEN"}
  - {id: "DEC-008", question: "Whose Twilio account holds the JayFoods WhatsApp sender, and who pays the Twilio fees?", owner: "Prince Caleb", required_decision: "Proposed: a separate Twilio subaccount for JayFoods under Caleb's account (so its auth token cannot touch Lisa's numbers), billed to JayFoods through Opskeep", blocks_approval: false, status: "OPEN"}
  - {id: "DEC-007", question: "Is the client's existing customer list imported?", owner: "JayFoods owner", required_decision: "Proposed: not in this change. If later, import only name, phone, area and usual order, with a marketing-consent flag, and never message customers first without consent", blocks_approval: false, status: "OPEN"}
