  - {id: "THR-015", component_ids: ["CMP-002"], scenario: "The admin is taken over through the first-run password published in the public repository or a stolen session, giving access to the inbox, settings and kill switch", likelihood: "MEDIUM", impact: "HIGH", control_ids: ["CTL-AUTH-001", "CTL-SES-001", "CTL-CFG-001"], refs: ["OWASP-T10-2025:A07"], residual_risk: "MEDIUM", owner: "Prince Caleb", status: "OPEN"}
