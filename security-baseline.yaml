  - {id: "THR-002", component_ids: ["CMP-005"], scenario: "The model states a wrong price, discount or total in its reply text", likelihood: "MEDIUM", impact: "MEDIUM", control_ids: ["CTL-AI-002", "CTL-AI-003"], refs: ["OWASP-LLM-2025:LLM09", "OWASP-LLM-2025:LLM05"], residual_risk: "LOW", owner: "Prince Caleb", status: "OPEN"}
  - {id: "THR-003", component_ids: ["CMP-003"], scenario: "Someone posts forged or replayed webhook requests to place orders or trigger owner tools as another number", likelihood: "MEDIUM", impact: "HIGH", control_ids: ["CTL-API-001", "CTL-API-002"], refs: ["OWASP-T10-2025:A07", "OWASP-T10-2025:A08"], residual_risk: "LOW", owner: "Prince Caleb", status: "OPEN"}
  - {id: "THR-004", component_ids: ["CMP-004", "CMP-005"], scenario: "A website visitor claims to be the owner or types another customer's number to read their orders", likelihood: "HIGH", impact: "HIGH", control_ids: ["CTL-AUTHZ-001", "CTL-AUTHZ-002"], refs: ["OWASP-T10-2025:A01"], residual_risk: "LOW", owner: "Prince Caleb", status: "OPEN"}
  - {id: "THR-005", component_ids: ["CMP-003", "CMP-004", "CMP-006"], scenario: "Message flooding or a bot runs up AI and messaging costs or fills the orders table with fake orders", likelihood: "MEDIUM", impact: "MEDIUM", control_ids: ["CTL-API-003", "CTL-AI-004"], refs: ["OWASP-LLM-2025:LLM10", "OWASP-ASI-2026:ASI08"], residual_risk: "MEDIUM", owner: "Prince Caleb", status: "OPEN"}
  - {id: "THR-006", component_ids: ["CMP-008", "CMP-010"], scenario: "Provider tokens or the app key leak through the public repository, logs, prompts or the admin API", likelihood: "MEDIUM", impact: "CRITICAL", control_ids: ["CTL-SEC-001", "CTL-SEC-002", "CTL-LOG-001"], refs: ["OWASP-T10-2025:A02", "OWASP-LLM-2025:LLM02"], residual_risk: "LOW", owner: "Prince Caleb", status: "OPEN"}
  - {id: "THR-007", component_ids: ["CMP-005", "CMP-008"], scenario: "Owner tools are reached by someone who is not the owner (spoofed number, a staff member's phone, a lost phone)", likelihood: "LOW", impact: "HIGH", control_ids: ["CTL-AUTHZ-002", "CTL-AUTHZ-003", "CTL-LOG-002"], refs: ["OWASP-T10-2025:A01", "OWASP-ASI-2026:ASI03"], residual_risk: "MEDIUM", owner: "JayFoods owner", status: "OPEN"}
  - {id: "THR-008", component_ids: ["CMP-005"], scenario: "A customer is stuck with the bot, or the agent keeps answering after staff take over", likelihood: "MEDIUM", impact: "MEDIUM", control_ids: ["CTL-AI-005", "CTL-AI-006"], refs: ["OWASP-ASI-2026:ASI09"], residual_risk: "LOW", owner: "JayFoods owner", status: "OPEN"}
  - {id: "THR-009", component_ids: ["CMP-002", "CMP-004"], scenario: "Chat text or customer names rendered in the admin inbox or the widget run as script (stored XSS)", likelihood: "MEDIUM", impact: "HIGH", control_ids: ["CTL-INP-001", "CTL-FE-001"], refs: ["OWASP-T10-2025:A05", "ASVS-5.0:V1"], residual_risk: "LOW", owner: "Prince Caleb", status: "OPEN"}
  - {id: "THR-010", component_ids: ["CMP-008"], scenario: "Invoice files are guessed or shared links stay valid forever and expose a customer's order", likelihood: "MEDIUM", impact: "MEDIUM", control_ids: ["CTL-FILE-001", "CTL-CRY-001"], refs: ["OWASP-T10-2025:A01", "ASVS-5.0:V5"], residual_risk: "LOW", owner: "Prince Caleb", status: "OPEN"}
  - {id: "THR-011", component_ids: ["CMP-006", "CMP-005"], scenario: "An AI provider is down or slow, the webhook times out, Meta retries and the customer gets duplicate replies or none", likelihood: "MEDIUM", impact: "MEDIUM", control_ids: ["CTL-ERR-001", "CTL-API-002"], refs: ["OWASP-T10-2025:A10"], residual_risk: "LOW", owner: "Prince Caleb", status: "OPEN"}
  - {id: "THR-012", component_ids: ["CMP-006", "CMP-007"], scenario: "Customer data is kept or reused by Meta or AI providers beyond what the customer expects, or kept here longer than needed", likelihood: "MEDIUM", impact: "MEDIUM", control_ids: ["CTL-DATA-001", "CTL-DATA-002"], refs: ["OWASP-LLM-2025:LLM02"], residual_risk: "MEDIUM", owner: "JayFoods owner", status: "OPEN"}
  - {id: "THR-013", component_ids: ["CMP-010"], scenario: "An unreviewed change or a compromised account deploys a weakened agent (for example tools without role checks) to the live site", likelihood: "MEDIUM", impact: "HIGH", control_ids: ["CTL-DEP-001", "CTL-SC-001", "CTL-GOV-001"], refs: ["OWASP-T10-2025:A03", "SSDF-1.1:PS.1"], residual_risk: "MEDIUM", owner: "Prince Caleb", status: "OPEN"}
