  dev_environment: {status: "PLANNED", practice: "Local work uses a throwaway database and test numbers; no live secrets on dev machines beyond the admin's own entry"}
  secure_coding: {status: "PLANNED", practice: "Project rules: prepared statements only, escape on output, server-side money, deny-by-default tool roles; reviewed against this baseline's controls"}
  code_review: {status: "PLANNED", practice: "Every change through a pull request that Caleb reviews and merges"}
  security_testing: {status: "PLANNED", practice: "PHP test suite covering roles, prices, injection strings, signatures, replay, limits, XSS strings; scenario script run against a test number before go-live"}
  release_archive: {status: "PLANNED", practice: "Tagged releases with attestation kept on GitHub for 12 months"}
  data_integrity: {status: "PLANNED", practice: "Signed webhooks, signed links and sessions, json_decode only (no unserialize), quote ids bound to the conversation"}
  vulnerability_class_reduction: {status: "PLANNED", practice: "Money never in model output paths; one escaping helper for all chat rendering; tool layer as the only route from the model to data"}
  build_hardening: {status: "PLANNED", practice: "declare(strict_types=1) in every new file; display_errors off in production; PHP lint with the production PHP version in CI"}
  file_handling: {status: "PLANNED", practice: "Generated PDFs only, stored outside the web root with random names, signed expiring links, 30-day deletion (CTL-FILE-001)"}
  token_validation: {status: "PLANNED", practice: "Existing admin JWT: HS256 pinned, expiry checked; new signed links and chat sessions: HMAC-SHA256 with purpose-specific keys, expiry inside the signed data, constant-time compare"}
ai_profile:
