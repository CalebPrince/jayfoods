changes:
  - id: "CHG-001"
    type: "MODIFIED"
    material: true
    summary: "AI provider chain changed to Lisa's: Anthropic, then OpenAI, then OpenRouter, then Groq, each with an optional backup model and its own time limit (20 s, OpenRouter 30 s), whole chain at most 90 s. Gemini and DeepSeek removed."
    old_rule: "Providers per DEC-003 (Gemini, Anthropic, Groq, OpenAI, OpenRouter, DeepSeek in that order) sharing one 25 s budget"
    new_rule: "Anthropic, OpenAI, OpenRouter, Groq in that order, main then backup model per provider, 20 to 30 s per attempt, 90 s cap"
    reason: "Caleb (23 Oct 2026): match the prince-web-app setup and give every provider a fallback so one slow provider cannot starve the others"
    security_impact: "LOW"
    affected: ["CMP-006", "CTL-AI-004", "DEC-003", "THR-005", "THR-011"]
    impact: "Two fewer processors receive chat text. A message can now cost up to five model attempts and take up to 90 s before the fixed reply, so the cost cap per message is higher; per-sender message caps, spend limits at each provider and the no-retry-after-a-tool-acted rule are unchanged"
    compensating_controls: ["CTL-AI-004", "CTL-SEC-002", "CTL-LOG-002"]
    status: "PROPOSED"
  - id: "CHG-002"
    type: "MODIFIED"
    material: true
    summary: "WhatsApp transport changed to Twilio, as Lisa: the JayFoods number becomes a Twilio WhatsApp sender, messages arrive at /api/v1/whatsapp/twilio signed with X-Twilio-Signature, replies and invoice PDFs go out through Twilio's Messages API. Meta Cloud API stays as an alternative provider; only the chosen one's webhook accepts messages."
    old_rule: "Meta Cloud API directly: app secret signature in, system-user token out"
    new_rule: "Twilio by default: auth-token signature over the exact webhook URL in, Account SID and auth token out; provider switch in the admin"
    reason: "Caleb (23 Oct 2026): follow the Twilio WhatsApp sender steps used for Lisa; creating a Meta app was blocked because the business is not registered"
    security_impact: "MEDIUM"
    affected: ["CMP-007", "TB-002", "TB-005", "FLW-001", "ID-006", "ID-007", "CTL-API-001", "CTL-SEC-002", "THR-003", "THR-006", "THR-012"]
    impact: "Twilio becomes a processor of message content and phone numbers. Its auth token is account-wide (it can send from any number on the account), so it must live in a JayFoods-only account or subaccount (DEC-008). The webhook signature depends on the Live site address matching Twilio's configured URL exactly. Twilio adds a per-message fee."
    compensating_controls: ["CTL-API-001", "CTL-SEC-001", "CTL-SEC-002", "CTL-DATA-002"]
    status: "PROPOSED"
  - id: "CHG-003"
    type: "ADDED"
    material: true
    summary: "Admin roles and a site-wide error log. Accounts get one of three roles: super admin (everything), admin (running the shop) and staff (day to day). AI provider and Kafui settings, templates, email and Paystack settings, backups, accounts and the error log become super admin only. The error log collects server errors, 5xx API responses, failed outgoing calls, failed email and visitors' browser script errors."
    old_rule: "Every admin account could do everything in the admin, including AI provider keys, WhatsApp settings, the owner list, backups and other accounts"
    new_rule: "Server-side role check on every admin route (CTL-AUTHZ-004), deny by default to the super admin; the first account becomes the super admin; error log for the super admin only (CTL-LOG-003)"
    reason: "Caleb (23 Oct 2026): make his account the super admin, let him add admin and staff accounts, keep AI providers and Kafui settings from everyone else, and give the super admin one place to see any error on the site"
    security_impact: "MEDIUM"
    affected: ["ID-004", "CMP-002", "CMP-008", "CTL-AUTHZ-004", "CTL-LOG-001", "CTL-LOG-003", "THR-006"]
    impact: "Narrows what most admin accounts can reach, so a staff login that leaks no longer exposes provider keys, WhatsApp settings or backups. Adds a public endpoint that accepts browser error reports (rate-limited, size-capped, write-only, never shown back to the public) and a new store of error text, masked before saving and kept 30 days. The provider details that used to appear in a chat note now show only in the super admin's views."
    compensating_controls: ["CTL-AUTHZ-004", "CTL-LOG-003", "CTL-LOG-001", "CTL-SEC-001"]
    status: "PROPOSED"
  - id: "CHG-004"
    type: "MODIFIED"
    material: true
    summary: "Deploys update the database by themselves and browsers stop using old site files. The first web request after a cPanel pull runs the database migration once, under a lock; pages, scripts and styles are sent with Cache-Control: no-cache."
    old_rule: "After every pull someone ran php database/migrate.php by hand in the cPanel terminal; until then new code ran against the old database (on 23 Oct 2026 this took the admin down)"
    new_rule: "The web process runs the idempotent migration when the schema files change (CTL-REC-003); running it by hand stays possible"
    reason: "Caleb (23 Oct 2026): make the migration run on every cPanel pull and stop browsers using old admin files after a deploy"
    security_impact: "LOW"
    affected: ["CMP-008", "CMP-010", "CTL-REC-003", "THR-016", "DEC-006"]
    impact: "The web server process now applies schema changes, which it could already do (it owns the database file). Only code from the repository runs; nothing a visitor sends decides whether or what migrates. A failed migration no longer needs someone at the terminal to notice it: it shows in the error log. On a brand-new database the first-admin password goes to a server-only file instead of the terminal."
    compensating_controls: ["CTL-REC-003", "CTL-LOG-003", "CTL-SC-001"]
    status: "PROPOSED"
  - id: "CHG-005"
    type: "MODIFIED"
    material: true
    summary: "Free OpenRouter models (openrouter/free and any model ending in :free) may use up to 2,000 output tokens instead of 600. They are thinking models that count their thinking in that limit, and with 600 they ran out before replying, so every price or order question fell through to Groq."
    old_rule: "600 output tokens for every provider and model"
    new_rule: "600 output tokens, except 2,000 for free OpenRouter models; paid models and Groq keep 600"
    reason: "Caleb (23 Oct 2026): raise the reply limit so the free models can answer"
    security_impact: "LOW"
    affected: ["CTL-AI-004", "CMP-006", "THR-005"]
    impact: "No cost: free models are not billed. A free-model attempt can take a little longer, still inside its 30 s attempt limit and the 90 s chain limit. Groq keeps 600 because it counts the requested limit against its per-minute allowance. Free OpenRouter endpoints may keep what they are sent; acceptable while only the owners and testers use Kafui, and to be replaced by paid models before launch (noted with Caleb)."
    compensating_controls: ["CTL-AI-004", "CTL-AI-003", "CTL-API-003"]
    status: "PROPOSED"
